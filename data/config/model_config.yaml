# NRL Prediction Model Configuration
# Loaded by scripts/lib/config.py on pipeline startup.
# Run `python scripts/update_tips.py --train` to retrain and update ensemble_weights.

# XGBoost hyperparameters
xgboost:
  n_estimators: 100
  max_depth: 4
  learning_rate: 0.1

# Ensemble sub-model weights (must sum to 1.0).
# These are updated automatically when running --train.
# When xgboost_model.json is missing, the pipeline falls back to
# elo + market only with weights redistributed proportionally.
ensemble_weights:
  elo: 0.40
  xgboost: 0.35
  market: 0.25
